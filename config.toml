# valen harness config. See SPEC.md for the full schema.
# Lives at ~/.config/valen/config.toml; config-ori.toml beside it is the pristine default.

model = "openrouter/anthropic/claude-sonnet-5.5"
# thinking = "high"            # optional reasoning level; omit for provider default.
                               # Per-model (/effort picker, ctrl+t cycles low→high, wraps):
                               # muse-spark: minimal, low, medium, high, xhigh.
                               # gpt/grok: low…max (+none on gpt). glm/deepseek:
                               # low/high/max or high/max. kimi-k3: max only.
                               # Toggle (kimi-k2.6, qwen, …): none, high.
                               # Fixed (mimo, minimax, …): omit (default only).
                               # Unknown models learn from the provider 400 and
                               # cache to $XDG_DATA_HOME/valen/thinking_levels.json.
                               # Switch live with /model (ctrl+p) and /effort — saved to state.json beside this file
                               # (overrides model/thinking here; delete it to reset).
thinking = "high"
tools = ["web_search", "web_fetch", "shell", "read", "write", "edit", "glob", "grep"]
base_url = "https://opencode.ai/zen/go/v1"
# API keys: empty by default, falling back to the env vars
# OPENCODE_API_KEY / OPENROUTER_API_KEY. Set a value here to override.
opencode_key = ""
openrouter_key = ""
# Second provider (no boot crash when unset):
#   /model always lists OpenRouter models as openrouter/<vendor>/<model>
#   (recent flagships in the fallback when offline/unkeyed), served via
#   OpenRouter's OpenAI-compatible chat endpoint with reasoning_effort for
#   thinking and no Go session header. Picking or sending with one and no
#   key reports "OpenRouter key not found" (Go models report "OpenCode Go
#   API key not found" the same way).
# session_id = "ses-stable-id"   # optional, generated per run when omitted

# system prompt: omit to use the harness prompt files (per model family —
# meta/anthropic/beast/codex/copilot/gemini/gpt/gpt_astra/kimi/trinity/
# default — opencode-adapted, valen-tuned). Set `system = "..."` only to
# override them entirely.
# system = "..."                    # full override when set; empty uses prompt files.
# ~/.config/valen/AGENTS.md (beside this file), when present, is appended to the
# prompt files as silent standing instructions (capped at 32 KiB; not applied
# when `system` is set).
# plan = false                      # plan mode: read-only investigation, the
                                    # reply is the plan (write/edit/shell
                                    # blocked, task explore-only). TUI /plan
                                    # toggles at runtime; -plan for headless.
# max_rounds = 300                  # per-turn round backstop (default 300). On
                                # exhaustion the turn compacts send-side and gets
                                # exactly one more window; a second exhaustion
                                # is terminal ("across 2 compacted windows").
# max_stagnant_rounds = 25       # maximum consecutive identical ordered tool
                                # batches; changed calls reset the count.
                                # Read-only research is not stagnation.
# request_timeout_seconds = 300 # each HTTP attempt, including SSE/unary body;
                                # retries get fresh deadlines, not a turn limit.

# max_context_tokens = 0       # 0 = auto: the model's own input window when
                               # known (gemini 1M, claude 500k, gpt 400k, grok/
                               # qwen/kimi 256k, glm/minimax 200k, deepseek
                               # 128k, else 300k); explicit values override and
                               # survive /model switches. Fail-fast per-round
                               # budget (est. runes/4): over-budget history
                               # aborts the turn instead of a doomed oversized
                               # send. Auto-compaction (keep*3) normally fires
                               # long before this binds, and a provider 400/
                               # 413 compacts once and retries. A lone
                               # oversized turn cannot shrink and may still
                               # fail fast.
# temperature = 0.2               # omit entirely for provider defaults
# max_tokens = 16384             # output cap on all three transports; positive
                                # explicit values are honored without a floor.

[compaction]                    # summary-mode, send-side only (disk JSONL stays lossless).
model = "openrouter/anthropic/claude-sonnet-5.5"
thinking = "high"
# auto = true                     # prune older outputs; protect latest 2 user turns + 40k older tokens; summarize older turns.
# keep_tokens = 15000             # soft whole-turn tail target; entire current turn always kept; threshold keep*3.
# buffer = 30000                  # headroom below max_context_tokens; default 10% of the budget.

[tui]                           # transcript rendering (TUI only).
# max_lines = 1000              # rendered committed-transcript line budget.
                                # Long sessions otherwise rebuild an ever-
                                # growing scrollback every ~60ms and slow the
                                # TUI down. Over budget, older turns collapse
                                # their reasoning then reply bodies (user
                                # prompts and tool lines are kept; a "… N
                                # earlier turns trimmed" row marks any dropped
                                # turns). Disk history stays lossless and
                                # ctrl+h/recall views still expand everything.
                                # 0 (or less) disables trimming.
# sound = true                  # ring the terminal bell when a question appears or a
                                # turn finishes (not on cancel); false mutes it.

# NOTE: [input] must stay the last table in this file. In TOML every key
# after a [table] header belongs to that table, so top-level keys placed
# below it decode as input.* and fail strict loading.
# [input]                         # chatbox chrome (TUI only): steady cursor + box height.
# blink = true                    # block-cursor blink; set false for a steady cursor.
# height = 3                      # input box height in lines; default 3.
[input]
blink = false

# AskUserQuestion is always registered, so models can ask clarifying questions
# in TUI and headless runs. todowrite/todoread are always registered too, so
# chunky work breaks into small session-plan steps even when tools omits them.
# task is always registered as well (explore/general subagent delegation).
# File tools (read, write, edit, glob, grep) and shell are scoped to the
# workdir: the startup directory, `-dir <path>`, or a positional directory in
# TUI mode (e.g. `./valen ~/Code/something`). Sibling git worktrees of the
# same repo are allowed. Other paths outside ask for approval once per folder
# via AskUserQuestion; without an interactive frontend they are denied.
# `shell` additionally runs in an OS sandbox (macOS sandbox-exec, Linux bwrap):
# it can write only to those same places plus temp/cache dirs, cannot see
# credential files (~/.ssh, ~/.aws, .env files, ...) and has no network unless
# the call asks for it (approved once per session, as are git push, rm -r, sudo).
# Other operating systems are not supported.

