# valen harness config. See SPEC.md for the full schema.

model = "muse-spark-1.3-contributor"
# thinking = "high"            # optional reasoning level; omit for provider default.
                               # Per-model (/effort picker, ctrl+t cycles low→high, wraps):
                               # muse-spark: minimal, low, medium, high, xhigh.
                               # gpt/grok: low…max (+none on gpt). glm/deepseek:
                               # low/high/max or high/max. kimi-k3: max only.
                               # Toggle (kimi-k2.6, qwen, …): none, high.
                               # Fixed (mimo, minimax, …): omit (default only).
                               # Unknown models learn from the provider 400 and
                               # cache to $XDG_DATA_HOME/valen/thinking_levels.json.
                               # Switch live with /model (ctrl+p) and /effort — saved back here.
thinking = "high"
tools = ["web_search", "web_fetch", "shell", "read", "write", "edit", "glob", "grep"]
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_GO_API_KEY"
# session_id = "ses-stable-id"   # optional, generated per run when omitted

# system prompt: omit to use the harness prompt files (per model family —
# meta/anthropic/beast/codex/copilot/gemini/gpt/gpt_astra/kimi/trinity/
# default — opencode-adapted, valen-tuned). Set `system = "..."` only to
# override them entirely.
# system = "..."                    # full override when set; empty uses prompt files.
# plan = false                      # plan mode: read-only investigation, the
                                    # reply is the plan (write/edit/shell
                                    # blocked, task explore-only). TUI /plan
                                    # toggles at runtime; -plan for headless.
# max_rounds = 100 
# max_stagnant_rounds = 25       # abort a turn whose tool loop runs this many
                                # rounds with calls but no write/edit/task
                                # (exploring without acting); raise for long
                                # research turns.

# max_context_tokens = 200000  # fail-fast per-round budget (est. runes/4):
                               # over-budget history aborts the turn instead of
                               # a doomed 1M-token send into a 429. Raise for
                               # large-context models; auto-compaction usually
                               # keeps work going instead of restarting.
# temperature = 0.2               # omit entirely for provider defaults
# max_tokens = 16384             # per-answer output cap on the messages transport (default 16384, floor 8192):
                                # long answers finish in one round instead of two full-history rounds.

[compaction]                    # summary-mode, send-side only (disk JSONL stays lossless).
model = "muse-spark-1.3-contributor"
thinking = "high"
# auto = true                     # prune every send; summarize past the threshold; retry once after a too-long 400.
# keep_tokens = 15000             # recent tail kept verbatim beside the summary; also sets the early threshold (keep×3).
# buffer = 30000                  # headroom below max_context_tokens; default 10% of the budget.

# NOTE: [input] must stay the last table in this file. In TOML every key
# after a [table] header belongs to that table, so top-level keys placed
# below it decode as input.* and fail strict loading.
# [input]                         # chatbox chrome (TUI only): steady cursor + box height.
# blink = true                    # block-cursor blink; set false for a steady cursor.
# height = 3                      # input box height in lines; default 3.
[input]
blink = false

# AskUserQuestion is always registered, so models can ask clarifying questions
# in TUI and headless runs. todowrite/todoread are always registered too, so
# chunky work breaks into small session-plan steps even when tools omits them.
# task is always registered as well (explore/general subagent delegation).
# File tools (read, write, edit, glob, grep) and shell are scoped to the
# workdir: the startup directory, `-dir <path>`, or a positional directory in
# TUI mode (e.g. `./valen ~/Code/something`). Paths outside ask for approval
# via AskUserQuestion; without an interactive frontend they are denied.

